name: Source verification (no live accounts)
on:
  push:
    branches: ["main", "bootstrap/**", "develop/**", "tur/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regression:
    name: Node regressions and manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run every Node test
        run: |
          set -euo pipefail
          count=$(find tests -maxdepth 1 -name 'test-*.cjs' | wc -l)
          test "$count" -eq 85
          for file in tests/test-*.cjs; do node "$file"; done
      - name: Structural Chrome extension tests
        run: python tests/test-package.py
  simulated-chromium-ui:
    name: Mocked Chromium UI only (not real MV3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run mocked UI smoke test
        run: |
          CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export CHROMIUM_PATH
          python tests/test-ui-smoke.py
  windows-structural:
    name: Windows Node and manifest (no physical MV3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Node regressions
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem tests/test-*.cjs)
          if ($tests.Count -ne 85) { throw "Expected 85 Node tests, got $($tests.Count)" }
          foreach ($test in $tests) { node $test.FullName; if ($LASTEXITCODE -ne 0) { throw "FAIL: $($test.Name)" } }
      - run: python tests/test-package.py
  provenance-archives:
    name: CI source/Chrome ZIP Git blob and CRC parity (NOT live MV3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify canonical PR HEAD (never package synthetic merge)
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deterministic ZIPs and SHA receipts
        shell: bash
        run: |
          set -euo pipefail
          python tools/build-release-artifacts.py --out-dir "$RUNNER_TEMP/embasic-tur026"
          python tools/build-release-artifacts.py --out-dir "$RUNNER_TEMP/embasic-tur026-repeat"
          diff -q "$RUNNER_TEMP/embasic-tur026/SHA256SUMS.txt" "$RUNNER_TEMP/embasic-tur026-repeat/SHA256SUMS.txt"
          diff -q "$RUNNER_TEMP/embasic-tur026/GitHub_tracked_blob_provenance.json" "$RUNNER_TEMP/embasic-tur026-repeat/GitHub_tracked_blob_provenance.json"
          (cd "$RUNNER_TEMP/embasic-tur026" && sha256sum -c SHA256SUMS.txt)
      - name: Save audit artifacts (CI only, not approved release)
        uses: actions/upload-artifact@v4
        with:
          name: tur026-v1.18.0-source-chrome-sha-gitblobs
          path: ${{ runner.temp }}/embasic-tur026/
          if-no-files-found: error
          retention-days: 30
