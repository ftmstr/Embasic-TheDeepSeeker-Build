name: Source verification (no live accounts)
on:
  push:
    branches: ["main", "bootstrap/**", "develop/**", "tur/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regression:
    name: Node regressions and manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact event HEAD before any test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/verify-ci-checkout.py --expected-sha "$EXPECTED_SHA"

      - name: Run every Node test
        run: |
          set -euo pipefail
          count=$(find tests -maxdepth 1 -name 'test-*.cjs' | wc -l)
          test "$count" -eq 95
          for file in tests/test-*.cjs; do node "$file"; done
      - name: Structural Chrome extension tests
        run: |
          python tests/test-package.py
          python tests/test-release-turn.py
          python tests/test-mv3-ci-gate.py
          python tests/test-ci-head-binding.py
          python tests/test-mv3-child-origin.py
          python tests/test-mv3-witness-contract.py
          python tests/test-mv3-witness-boundary-batch.py
  simulated-chromium-ui:
    name: Mocked Chromium UI only (not real MV3)
    # Pin a supported, stable Ubuntu LTS; ubuntu-latest resolved to 26.10
    # (resolute) on the failed 43034694123 run, with transient apt DNS outage.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact event HEAD before any test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/verify-ci-checkout.py --expected-sha "$EXPECTED_SHA"

      - run: python -m pip install playwright
      - name: Install Chromium and operating-system dependencies (bounded retry; fail closed)
        shell: bash
        run: |
          set -euo pipefail
          # Do not substitute --no-deps, skip Playwright, or turn a missing
          # browser into a green MOCK UI result. The genuine MV3 gate below
          # still requires a real Chromium worker and eight exact checkpoints.
          for attempt in 1 2 3; do
            if timeout --signal=TERM --kill-after=10s 180s python -m playwright install --with-deps chromium; then
              echo "PASS Chromium dependencies installed on stable ubuntu-24.04 (attempt $attempt)"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo '::error::Chromium/apt dependency installation failed three times; genuine MV3 NOT_RUN; CI must fail'
              exit 1
            fi
            echo "::warning::Transient Chromium/apt dependency failure, bounded retry $attempt/3"
            sleep "$((attempt * 5))"
          done
      - name: Run mocked UI smoke test
        run: |
          CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export CHROMIUM_PATH
          python tests/test-ui-smoke.py
      - name: Resolve evidence branch label (not a production attestation)
        id: evidence-label
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ "$SOURCE_BRANCH" =~ ^tur([0-9]{3,})/ ]]; then
            echo "label=tur${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo 'label=unscoped' >> "$GITHUB_OUTPUT"
          fi
      - name: Probe genuine unpacked Chromium MV3 worker (Linux CI; not physical Windows)
        shell: bash
        run: |
          set -euo pipefail
          CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export CHROMIUM_PATH EMBASIC_HEADLESS=1 EMBASIC_REQUIRE_MV3=1 EMBASIC_MV3_WAIT_MS=9000 EMBASIC_TUR029_PROFILE_PROBE=1 EMBASIC_TUR029_NATIVE_ALARM=1 EMBASIC_TUR029_ALARM_TIMEOUT_S=70 EMBASIC_TUR030_RESTART_ALARM=1 EMBASIC_TUR030_ALARM_TIMEOUT_S=70 EMBASIC_TUR031_LOCKED_ALARM=1 EMBASIC_TUR031_ALARM_TIMEOUT_S=70 EMBASIC_TUR032_LOCKED_RESTART=1 EMBASIC_TUR032_ALARM_TIMEOUT_S=70 EMBASIC_TUR038_FOURTH_RESTART=1 EMBASIC_TUR038_ALARM_TIMEOUT_S=70
          # TUR040: capture direct child stdout/exit atomically, with no
          # shell pipeline status substitution. Fail closed.
          python tools/capture-mv3-probe.py --log "$RUNNER_TEMP/tur040-mv3-probe.log" --timeout-seconds 360
          # A green CI job must never hide timeout, NOT_RUN, missing evidence,
          # duplicate checkpoints, or a failed probe behind the mocked UI.
          python tools/verify-mv3-ci-evidence.py --log "$RUNNER_TEMP/tur040-mv3-probe.log" --exit-code 0
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ steps.evidence-label.outputs.label }}-linux-real-mv3-locked-restart-evidence
          path: ${{ runner.temp }}/tur040-mv3-probe.log
          if-no-files-found: error
          retention-days: 30
  windows-structural:
    name: Windows Node and manifest (no physical MV3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact event HEAD before any test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/verify-ci-checkout.py --expected-sha "$env:EXPECTED_SHA"

      - name: Run Node regressions
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem tests/test-*.cjs)
          if ($tests.Count -ne 95) { throw "Expected 95 Node tests, got $($tests.Count)" }
          foreach ($test in $tests) { node $test.FullName; if ($LASTEXITCODE -ne 0) { throw "FAIL: $($test.Name)" } }
      - run: python tests/test-package.py
      - run: python tests/test-release-turn.py
      - run: python tests/test-mv3-ci-gate.py
      - run: python tests/test-ci-head-binding.py
      - run: python tests/test-mv3-child-origin.py
      - run: python tests/test-mv3-witness-contract.py
      - run: python tests/test-mv3-witness-boundary-batch.py
  provenance-archives:
    name: CI source/Chrome ZIP Git blob and CRC parity (NOT live MV3)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'tur')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Resolve and validate exact TUR branch
        id: turn
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_BRANCH" =~ ^tur([0-9]{3,})/ ]]; then
            echo '::error::Cannot derive exact TUR from PR head branch'
            exit 1
          fi
          echo "tur=TUR${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
      - name: Verify canonical PR HEAD (never package synthetic merge)
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact PR HEAD via common fail-closed guard
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/verify-ci-checkout.py --expected-sha "$EXPECTED_SHA"
      - name: Verify deterministic ZIPs and SHA receipts
        shell: bash
        run: |
          set -euo pipefail
          TUR="${{ steps.turn.outputs.tur }}"
          BRANCH="${{ steps.turn.outputs.branch }}"
          python tools/build-release-artifacts.py --tur "$TUR" --branch "$BRANCH" --out-dir "$RUNNER_TEMP/embasic-current"
          python tools/build-release-artifacts.py --tur "$TUR" --branch "$BRANCH" --out-dir "$RUNNER_TEMP/embasic-repeat"
          diff -q "$RUNNER_TEMP/embasic-current/SHA256SUMS.txt" "$RUNNER_TEMP/embasic-repeat/SHA256SUMS.txt"
          diff -q "$RUNNER_TEMP/embasic-current/GitHub_tracked_blob_provenance.json" "$RUNNER_TEMP/embasic-repeat/GitHub_tracked_blob_provenance.json"
          (cd "$RUNNER_TEMP/embasic-current" && sha256sum -c SHA256SUMS.txt)
      - name: Save audit artifacts (CI only, not approved release)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.turn.outputs.tur }}-v1.18.0-source-chrome-sha-gitblobs
          path: ${{ runner.temp }}/embasic-current/
          if-no-files-found: error
          retention-days: 30
